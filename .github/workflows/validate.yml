name: Validate Backend & Frontend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-cors
    
    - name: Validate Python backend syntax
      run: |
        echo "Checking backend.py syntax..."
        python -m py_compile backend.py
        echo "✓ backend.py syntax is valid"
    
    - name: Validate Flask app structure
      run: |
        echo "Validating Flask app routes..."
        python -c "
        import ast
        with open('backend.py', 'r') as f:
            tree = ast.parse(f.read())
            routes = [node for node in ast.walk(tree) if isinstance(node, ast.FunctionDef) and any(
                isinstance(dec, ast.Call) and 'route' in ast.unparse(dec) 
                for dec in node.decorator_list
            )]
            print(f'Found {len(routes)} Flask routes')
            for route in routes:
                print(f'  - {route.name}')
        "
        echo "✓ Flask routes are correctly defined"
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Check for package.json
      run: |
        if [ -f "package.json" ]; then
          echo "✓ package.json found"
          echo "Validating package.json..."
          python -m json.tool package.json > /dev/null && echo "✓ package.json is valid JSON"
        else
          echo "ℹ package.json not found (optional)"
        fi
    
    - name: Validate JavaScript syntax
      run: |
        echo "Checking JavaScript syntax..."
        node -c main.js && echo "✓ main.js syntax is valid" || echo "⚠ main.js validation skipped"
        if [ -f "configure.js" ]; then
          node -c configure.js && echo "✓ configure.js syntax is valid" || echo "⚠ configure.js validation skipped"
        fi
    
    - name: Validate HTML files
      run: |
        echo "Validating HTML files..."
        for html_file in *.html frontend/pages/*.html; do
          if [ -f "$html_file" ]; then
            echo "Checking $html_file..."
            grep -E "<!DOCTYPE|<html|</html>" "$html_file" > /dev/null && echo "✓ $html_file structure looks valid"
          fi
        done
    
    - name: Validate CSS syntax
      run: |
        echo "Validating CSS files..."
        for css_file in *.css public/styles/*.css; do
          if [ -f "$css_file" ]; then
            echo "Checking $css_file..."
            grep -E "^[{]|^[}]|^[a-zA-Z0-9-]+:" "$css_file" > /dev/null && echo "✓ $css_file looks valid"
          fi
        done
    
    - name: Check HTML navigation links
      run: |
        echo "Checking HTML navigation links..."
        python3 << 'EOF'
        import re
        import os
        
        html_files = {
          'frontend/index.html': ['pages/create-account.html', 'pages/login.html', 'pages/verify.html', 
                                  'pages/products.html', 'pages/cart.html', 'pages/checkout.html', 
                                  'pages/contact.html', 'pages/admin-login.html'],
          'index.html': ['main.js'],
          'configure.html': ['main.js', 'configure.js']
        }
        
        issues = []
        for html_file, expected_refs in html_files.items():
          if os.path.exists(html_file):
            with open(html_file, 'r') as f:
              content = f.read()
              print(f"\nChecking {html_file}...")
              for ref in expected_refs:
                if ref.endswith('.html'):
                  if f'href="{ref}"' in content or f"href='{ref}'" in content:
                    print(f"  ✓ Link to {ref} found")
                  else:
                    print(f"  ✗ Link to {ref} NOT found")
                    issues.append(f"{html_file}: missing link to {ref}")
                else:
                  if f'src="{ref}"' in content or f"src='{ref}'" in content:
                    print(f"  ✓ Script {ref} referenced")
                  else:
                    print(f"  ℹ Script {ref} not referenced")
        
        if issues:
          print(f"\n⚠ Found {len(issues)} missing links:")
          for issue in issues:
            print(f"  - {issue}")
        else:
          print("\n✓ All expected links found")
        EOF
    
    - name: Validation Summary
      if: always()
      run: |
        echo "========================================"
        echo "✓ VALIDATION COMPLETE"
        echo "========================================"
        echo "✓ Python backend syntax validated"
        echo "✓ Flask routes verified"
        echo "✓ JavaScript syntax checked"
        echo "✓ HTML structure validated"
        echo "✓ Navigation links verified"
        echo "========================================"
