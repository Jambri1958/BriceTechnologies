name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          DEPLOY_DIR=/tmp/cloudflare-pages
          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"

          for path in CNAME index.html configure.html style.css configure.css main.js configure.js frontend public; do
            if [ -e "$path" ]; then
              mkdir -p "$DEPLOY_DIR/$(dirname "$path")"
              cp -R "$path" "$DEPLOY_DIR/$path"
            fi
          done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.131.1'
          command: pages deploy /tmp/cloudflare-pages --project-name=bricetechnologies
