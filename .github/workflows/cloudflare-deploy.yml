name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare deploy directory
        run: |
          DEPLOY_DIR=/tmp/cloudflare-pages
          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"

          for path in CNAME index.html configure.html style.css configure.css main.js configure.js frontend public; do
            if [ -e "$path" ]; then
              cp -R "$path" "$DEPLOY_DIR/$path"
            fi
          done

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.131.1 pages deploy /tmp/cloudflare-pages --project-name bricetechnologies
